<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta property="og:title" content="Listen in AURA">
  <meta property="og:description" content="Play the shared track in AURA for Windows.">
  <title>Listen in AURA</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", system-ui, sans-serif;
      --background: #151313;
      --surface: #211c1a;
      --border: #51443e;
      --text: #faf2eb;
      --muted: #d1bdb1;
      --accent: #f4c5a6;
      --on-accent: #291911;
      --hover: #362a25;
      --glow: #503224;
    }

    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        --background: #faf3ec;
        --surface: #fffaf5;
        --border: #c9b1a0;
        --text: #251c18;
        --muted: #6f5345;
        --accent: #7d3f26;
        --on-accent: #fff6ed;
        --hover: #f6e7dd;
        --glow: #f2d5c3;
      }
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      color: var(--text);
      background: radial-gradient(ellipse at 50% 12%, var(--glow), transparent 68%), var(--background);
    }

    main {
      width: min(100%, 480px);
      padding: clamp(20px, 6vw, 36px);
      border: 1px solid var(--border);
      border-radius: 22px;
      background: var(--surface);
      box-shadow: 0 20px 64px #180e0c20;
    }

    h1 { margin: 0 0 10px; font-size: clamp(25px, 6vw, 34px); line-height: 1.2; }

    p { margin: 0; color: var(--muted); line-height: 1.55; }

    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }

    .button {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 10px 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-weight: 600;
      text-align: center;
      text-decoration: none;
    }

    .button:hover { background: var(--hover); }
    .primary { border-color: var(--accent); color: var(--on-accent); background: var(--accent); }
    .primary:hover { border-color: var(--accent); background: var(--accent); text-decoration: underline; }
    .button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>Listen in AURA</h1>
    <p id="description" role="status">Get AURA for Windows from the latest release.</p>
    <div class="actions">
      <a id="open" class="button primary" hidden>Open in AURA</a>
      <a id="download" class="button primary" href="https://github.com/NoorAshraful/AURA-Desktop-Music-application/releases/latest">Download for Windows</a>
    </div>
  </main>
  <script>
    const description = document.getElementById("description");
    const entries = Array.from(new URLSearchParams(window.location.search));
    const videoId = entries.length === 1 && entries[0][0] === "v" ? entries[0][1] : "";

    if (videoId.length === 11 && /^[A-Za-z0-9_-]+$/.test(videoId)) {
      const open = document.getElementById("open");
      const download = document.getElementById("download");
      open.href = `aura-music://listen/${videoId}`;
      open.hidden = false;
      download.classList.remove("primary");
      description.textContent = "Play the shared track in the AURA desktop app.";

      let automatic = true;
      let fallbackTimer;

      function isForeground() {
        return !document.hidden && document.hasFocus();
      }

      function cancelFallback() {
        window.clearTimeout(fallbackTimer);
        fallbackTimer = undefined;
      }

      function keepListenPage() {
        if (fallbackTimer === undefined) return;
        cancelFallback();
        description.textContent = "Choose Open in AURA if your browser asks. You can also try again below.";
      }

      function watchForLaunch() {
        automatic = false;
        cancelFallback();
        description.textContent = "Opening the shared track in AURA…";
        // Browsers do not expose whether a custom protocol handler is installed.
        fallbackTimer = window.setTimeout(() => {
          if (isForeground()) {
            cancelFallback();
            description.textContent = "Taking you to the AURA download page…";
            window.location.replace(download.href);
          } else {
            keepListenPage();
          }
        }, 2800);
      }

      function openAutomatically() {
        if (!automatic || !isForeground()) return;
        watchForLaunch();
        try {
          window.location.assign(open.href);
        } catch {
          description.textContent = "Your browser may require you to click Open in AURA.";
        }
      }

      open.addEventListener("click", watchForLaunch);
      download.addEventListener("click", () => {
        automatic = false;
        cancelFallback();
      });
      window.addEventListener("focus", openAutomatically);
      window.addEventListener("blur", keepListenPage);
      window.addEventListener("pagehide", cancelFallback);
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) keepListenPage();
        else openAutomatically();
      });
      openAutomatically();
    } else if (entries.length) {
      description.textContent = "This listening link is incomplete or invalid.";
    }
  </script>
</body>
</html>
